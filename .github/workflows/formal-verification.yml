name: formal verification

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  # Cheap and always on: proves that the shipped .syso objects are still the
  # ones the Lean models and the committed certificates were produced from.
  # No Lean toolchain, a few seconds.  Fails when an asm, model or generator
  # change was not followed by regenerating and repacking.
  proof-gate:
    name: models and certificates (cheap)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the gate image
        run: docker build -f formal/ci/Dockerfile -t hashtree-proof-gate formal/ci
      - name: Check models, artifacts and certificate inputs
        run: docker run --rm -v "$PWD:/repo" hashtree-proof-gate

  # The heavy Lean check is deliberately NOT run on hosted runners: a full
  # kernel replay of Hashtree/Gen is too expensive.  Authors run
  # formal/verify.sh locally and an independent reviewer repeats it, comparing
  # the report.  This job exists for a self-hosted runner with the label
  # `hashtree-proof`, is manual only, and uploads the same report.
  proof-build:
    name: full certificates and audit (self-hosted, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: [self-hosted, hashtree-proof]
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@v4
      - name: Cache Lean oleans
        uses: actions/cache@v4
        with:
          path: formal/lean/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formal/lean/lean-toolchain', 'formal/lean/Gen.sha256', 'formal/lean/Hashtree/**/*.lean') }}
      - name: Build the toolchain image
        run: docker build -f formal/Dockerfile -t hashtree-formal formal
      - name: Check every proof and audit the axioms
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            -e VERIFY_COMMIT="$GITHUB_SHA" -e VERIFY_BRANCH="$GITHUB_REF_NAME" \
            -e VERIFY_DIRTY=0 -e VERIFY_GATE=skipped \
            hashtree-formal /repo/formal/verify.sh --inside-container \
              --out /repo/formal/verification-report.json
      - name: Upload the verification report
        uses: actions/upload-artifact@v4
        with:
          name: verification-report
          path: formal/verification-report.json
